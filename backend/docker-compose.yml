version: "3.8"
services:
  ames-backend:
    build: .
    container_name: ames-backend
    restart: unless-stopped
    environment:
      AMES_ES_URL: http://host.docker.internal:9268  # explicit: no app-level default anymore
      OTEL_SERVICE_NAME: ames-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AMES_OTEL_ENABLED: ${AMES_OTEL_ENABLED:-0}
      AMES_EMBED_BACKEND: local
      AMES_ADMIN_TOKEN: ${AMES_ADMIN_TOKEN:?set in .env}
      AMES_API_KEYS_FILE: /data/ames_keys.json
      AMES_CONSOLIDATE_INTERVAL: "600"
      AMES_LLM_BASE: http://host.docker.internal:20128/v1
      AMES_LLM_KEY: ${AMES_LLM_KEY:?set in .env}
      AMES_LLM_MODEL: auto/best-chat
    ports:
      - "127.0.0.1:8123:8123"   # loopback: reached via ssh forward
    volumes:
      - ~/ames-data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8123
  ames-worker:
    build: .
    container_name: ames-worker
    restart: unless-stopped
    environment:
      AMES_ES_URL: http://host.docker.internal:9268  # explicit: no app-level default anymore
      OTEL_SERVICE_NAME: ames-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AMES_OTEL_ENABLED: ${AMES_OTEL_ENABLED:-0}
      AMES_EMBED_BACKEND: local
      AMES_API_KEYS_FILE: /data/ames_keys.json
      AMES_CONSOLIDATE_INTERVAL: "600"
    volumes:
      - ~/ames-data:/data
    command: python -m app.worker
  ames-fact-worker:
    build: .
    container_name: ames-fact-worker
    restart: unless-stopped
    environment:
      AMES_ES_URL: http://host.docker.internal:9268
      OTEL_SERVICE_NAME: ames-fact-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AMES_OTEL_ENABLED: ${AMES_OTEL_ENABLED:-0}
      AMES_EMBED_BACKEND: local   # off-license; parity with ES _inference verified (cos>=0.99996)
      AMES_API_KEYS_FILE: /data/ames_keys.json
      AMES_LLM_BASE: http://host.docker.internal:20128/v1
      AMES_LLM_KEY: ${AMES_LLM_KEY:?set in .env}
      AMES_LLM_MODEL: ames-extract
      AMES_LLM_TEMPERATURE: omit
      AMES_LLM_DISABLE_THINKING: "1"
    volumes:
      - ~/ames-data:/data
    command: python -m app.worker --facts
  ames-backfill-worker:
    build: .
    container_name: ames-backfill-worker
    restart: unless-stopped
    environment:
      AMES_ES_URL: http://host.docker.internal:9268
      OTEL_SERVICE_NAME: ames-backfill-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AMES_OTEL_ENABLED: ${AMES_OTEL_ENABLED:-0}
      AMES_EMBED_BACKEND: local   # off-license; parity with ES _inference verified (cos>=0.99996)
      AMES_API_KEYS_FILE: /data/ames_keys.json
      AMES_LLM_BASE: http://host.docker.internal:20128/v1
      AMES_LLM_KEY: ${AMES_LLM_KEY:?set in .env}
      AMES_LLM_MODEL: ames-extract
      AMES_LLM_TEMPERATURE: omit
      AMES_LLM_DISABLE_THINKING: "1"
    volumes:
      - ~/ames-data:/data
    command: python -m app.worker --backfill
